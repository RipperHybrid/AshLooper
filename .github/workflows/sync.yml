name: Sync and Release

on:
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'normal = skip if tag exists | overwrite = recreate'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - overwrite

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight GitLab Check
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -e
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::GITLAB_TOKEN secret is empty or not set"
            exit 1
          fi
          if ! git ls-remote "https://oauth2:${GITLAB_TOKEN}@gitlab.com/RipperHybrid/AshLooper.git" > /dev/null 2>&1; then
            echo "::error::Cannot reach gitlab.com/RipperHybrid/AshLooper.git with the provided GITLAB_TOKEN"
            exit 1
          fi
          echo "GitLab preflight OK"

      - name: Push to GitLab
        env:
          TARGET_REPO: "gitlab.com/RipperHybrid/AshLooper.git"
        run: |
          git remote add gitlab https://oauth2:${{ secrets.GITLAB_TOKEN }}@${{ env.TARGET_REPO }} || true
          git push gitlab --all --force
          git push gitlab --tags --force

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Metadata and Check Release
        id: metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(/usr/bin/jq -r '.version' update.json)
          VERSION_CODE=$(/usr/bin/jq -r '.versionCode' update.json)
          TAG="v$VERSION"

          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "${{ github.event.inputs.deployment_type }}" = "normal" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "filename=AshReXcue_Bootloop_Protector_${VERSION}_${VERSION_CODE}.zip" >> $GITHUB_OUTPUT

          if [ -f "changelog.md" ] && grep -q '[^[:space:]]' changelog.md; then
            cp changelog.md release_body.md
            echo "body_file=release_body.md" >> $GITHUB_OUTPUT
          else
            echo "commit: $COMMIT_MSG" > release_msg.txt
            echo "body_file=release_msg.txt" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.metadata.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build WebUI
        if: steps.metadata.outputs.skip != 'true'
        run: |
          cd webroot
          npm install
          npm run build
          cp -r cgi-bin dist/
          cd ..
          mv webroot webroot_src
          mv webroot_src/dist webroot

      - name: Create Release Zip
        if: steps.metadata.outputs.skip != 'true'
        run: |
          cp .github/resources/banner.png banner
          zip -r ${{ steps.metadata.outputs.filename }} \
          jq \
          META-INF \
          webroot \
          action.sh \
          customize.sh \
          utils.sh \
          monitor.sh \
          module.prop \
          post-fs-data.sh \
          service.sh \
          settings.prop \
          uninstall.sh \
          banner

      - name: Check for Edit and Append Footer
        if: steps.metadata.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.metadata.outputs.tag }}"
          BODY_FILE="${{ steps.metadata.outputs.body_file }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            NOW_DATE=$(date +'%Y-%m-%d')
            NOW_TIME=$(date +'%H:%M:%S')

            echo "" >> "$BODY_FILE"
            echo "- Edited: Date: $NOW_DATE Time: $NOW_TIME" >> "$BODY_FILE"
          fi

      - name: Upload to GitHub Release
        if: steps.metadata.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.tag }}
          name: AshLooper Version ${{ steps.metadata.outputs.version }} Release
          body_path: ${{ steps.metadata.outputs.body_file }}
          files: ${{ steps.metadata.outputs.filename }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Force Update GitHub Release Title and Body
        if: steps.metadata.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BODY_FILE: ${{ steps.metadata.outputs.body_file }}
        run: |
          gh release edit "$TAG" \
            --title "AshLooper Version ${VERSION} Release" \
            --notes-file "$BODY_FILE"

      - name: Create GitLab Release
        if: steps.metadata.outputs.skip != 'true'
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_HOST: gitlab.com
          REPO: "RipperHybrid/AshLooper"
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
          ZIP_NAME: ${{ steps.metadata.outputs.filename }}
          BODY_FILE: ${{ steps.metadata.outputs.body_file }}
        run: |
          curl -sSL "https://gitlab.com/gitlab-org/cli/-/releases/v1.58.0/downloads/glab_1.58.0_linux_amd64.tar.gz" \
            | tar -xz -C /tmp
          sudo mv /tmp/bin/glab /usr/local/bin/glab

          if glab release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Existing GitLab release for $TAG found, deleting so it can be recreated"
            glab release delete "$TAG" --repo "$REPO" --yes || true
          fi

          glab release create "$TAG" \
            --repo "$REPO" \
            --name "AshLooper Version ${VERSION} Release" \
            --notes-file "$BODY_FILE" \
            "$ZIP_NAME"

      - name: Send to Telegram
        continue-on-error: true
        if: always() && steps.metadata.outputs.skip != 'true'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.MAIN_BUILDS }}
          ZIP_NAME: ${{ steps.metadata.outputs.filename }}
          REPO_SLUG: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT_HASH: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          BRANCH_NAME: ${{ github.ref_name }}
          GITLAB_REPO: "RipperHybrid/AshLooper"
        run: |
          [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ] && exit 0
          [ ! -f "$ZIP_NAME" ] && exit 1

          COMMIT_MSG=$(git log -1 --pretty=%B)
          printf 'commit: %s' "$COMMIT_MSG" > /tmp/tg_raw.txt
          RAW_LEN=$(wc -m < /tmp/tg_raw.txt)

          if [ "$RAW_LEN" -ge 1024 ]; then
            RAW_TEXT=$(cat /tmp/tg_raw.txt)
            TRUNCATED="${RAW_TEXT:0:950}"
            CLEANED=$(printf '%s' "$TRUNCATED" | sed -zE 's/[[:space:]]#.,*-]+$//')
            printf '%s....(truncated — see full commit via button below)' "$CLEANED" > /tmp/tg_caption.txt
          else
            cp /tmp/tg_raw.txt /tmp/tg_caption.txt
          fi

          BTN_TEXT="Manual Run ⚡️"
          BTN_URL="${SERVER_URL}/${REPO_SLUG}/actions/runs/${RUN_ID}"

          GITHUB_URL="${SERVER_URL}/${REPO_SLUG}"
          CHANGELOG_URL="${SERVER_URL}/${REPO_SLUG}/blob/${BRANCH_NAME}/changelog.md"
          GITLAB_URL="https://gitlab.com/${GITLAB_REPO}"

          KEYBOARD_JSON=$(printf \
            '{"inline_keyboard":[[{"text":"%s","url":"%s"},{"text":"Changelog 📝","url":"%s"}],[{"text":"GitHub 🐙","url":"%s"},{"text":"GitLab 🦊","url":"%s"}]]}' \
            "$BTN_TEXT" "$BTN_URL" "$CHANGELOG_URL" "$GITHUB_URL" "$GITLAB_URL")

          curl -s \
               -F "chat_id=$CHAT_ID" \
               -F "document=@${ZIP_NAME}" \
               -F "caption=</tmp/tg_caption.txt" \
               -F "reply_markup=$KEYBOARD_JSON" \
               "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"