<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AshLooper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-retro-mode">
    <div class="app">
        <header class="header">
            <div class="header-left">
                <h1 id="logoContainer"></h1>
            </div>
            <div class="header-right">
                <div class="header-right-content">
                    <span class="subtitle">Bootloop Protector</span>
                    <div class="powered-by-badge">
                        <span class="badge-text">Powered by AshBorn</span>
                    </div>
                    </div>
            </div>
        </header>

        <main class="main">
            <nav class="tab-navigation">
                <button class="tab-btn active" data-tab="logs">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 15V19C21 19.5304 20.7893 20.0391 20.4142 20.4142C20.0391 20.7893 19.5304 21 19 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 10L12 15L17 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 15V3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span>Logs</span>
                </button>
                <button class="tab-btn" data-tab="settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M13.7517 4.69329C13.7517 3.85839 13.1416 3.14883 12.3161 3.0238C12.1066 2.99207 11.8935 2.99207 11.6839 3.0238C10.8584 3.14883 10.2482 3.85839 10.2482 4.6933V5.87397C9.77662 6.00858 9.32734 6.19618 8.90726 6.42992L8.07205 5.59471C7.48168 5.00435 6.54849 4.93407 5.87637 5.42937C5.70578 5.55509 5.55509 5.70578 5.42937 5.87637C4.93407 6.54849 5.00434 7.4817 5.59471 8.07207L6.42992 8.90728C6.19617 9.32735 6.00857 9.77663 5.87397 10.2483H4.6933C3.85839 10.2483 3.14883 10.8584 3.0238 11.6839C2.99207 11.8935 2.99207 12.1066 3.0238 12.3161C3.14883 13.1416 3.85839 13.7518 4.69329 13.7518H5.87396C6.00857 14.2234 6.19617 14.6727 6.42992 15.0927L5.59471 15.9279C5.00434 16.5183 4.93407 17.4515 5.42937 18.1236C5.55509 18.2942 5.70578 18.4449 5.87638 18.5706C6.5485 19.0659 7.48169 18.9957 8.07205 18.4053L8.90726 17.5701C9.32734 17.8038 9.77662 17.9914 10.2482 18.126V19.3067C10.2482 20.1416 10.8584 20.8512 11.6839 20.9762C11.8934 21.0079 12.1066 21.0079 12.3161 20.9762C13.1416 20.8512 13.7517 20.1416 13.7517 19.3067V18.1261C14.2234 17.9914 14.6727 17.8038 15.0927 17.5701L15.9279 18.4053C16.5183 18.9957 17.4515 19.0659 18.1236 18.5706C18.2942 18.4449 18.4449 18.2942 18.5706 18.1236C19.0659 17.4515 18.9957 16.5183 18.4053 15.928L17.5701 15.0928C17.8038 14.6727 17.9914 14.2234 18.1261 13.7518H19.3067C20.1416 13.7518 20.8512 13.1416 20.9762 12.3161C21.0079 12.1066 21.0079 11.8935 20.9762 11.6839C20.8512 10.8584 20.1416 10.2483 19.3067 10.2483H18.126C17.9914 9.77662 17.8038 9.32734 17.5701 8.90726L18.4053 8.07205C18.9957 7.48168 19.0659 6.54849 18.5706 5.87637C18.4449 5.70578 18.2942 5.55509 18.1236 5.42937C17.4515 4.93407 16.5183 5.00434 15.9279 5.59471L15.0927 6.42992C14.6727 6.19617 14.2234 6.00857 13.7517 5.87396V4.69329Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9.5 12C9.5 10.6193 10.6193 9.5 12 9.5C13.3807 9.5 14.5 10.6193 14.5 12C14.5 13.3807 13.3807 14.5 12 14.5C10.6193 14.5 9.5 13.3807 9.5 12Z" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>Settings</span>
                </button>
            </nav>

            <div class="tab-content active" id="logsTab">
                <div class="terminal-container">
                    <div class="terminal-header">
                        <button type="button" id="fileSelectBtn" class="file-select-btn">
                            <span class="btn-text">Select Log File</span>
                            <span id="selectedFileName" class="file-name"></span>
                        </button>
                        <div class="terminal-controls"></div>
                    </div>
                    <div class="terminal" id="terminal">
                        <div class="terminal-output" id="terminalOutput">
                            <div class="welcome-message">
                                <div>AshReXcue WebUI V2.3</div>
                                <div>Select a log file to view contents</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tab-content" id="settingsTab">
                <div class="settings-container">
                </div>
            </div>
        </main>
        </div>

    <div id="filePopup" class="popup-overlay">
        <div class="popup">
            <div class="popup-header">
                <h3>Select Log File</h3>
                <button type="button" class="close-popup">&times;</button>
            </div>
            <div class="popup-content">
                <div class="file-list" id="fileList"></div>
                <button type="button" id="refreshBtn" class="refresh-btn">Refresh Files</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
