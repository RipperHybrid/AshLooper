<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AshLooper</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-mode">
    <div class="app">
        <header class="header">
            <div class="header-left">
                <h1>AshLooper</h1>
                <span class="subtitle">Bootloop Protection</span>
            </div>
            <div class="header-right">
                <button id="themeToggle" class="theme-btn" title="Toggle Theme"></button>
            </div>
        </header>

        <main class="main">
            <div class="terminal-container">
                <div class="terminal-header">
                    <button id="fileSelectBtn" class="file-select-btn">
                        <span class="btn-text">Select Log File</span>
                        <span id="selectedFileName" class="file-name"></span>
                    </button>
                    <div class="terminal-controls">
                    </div>
                </div>
                <div class="terminal" id="terminal">
                    <div class="terminal-output" id="terminalOutput">
                        <div class="welcome-message">
                            <div>AshLooper WebUI V1.0</div>
                            <div>Select a log file to view contents</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <div class="powered-by-badge">
                    <span class="badge-text">Powered by AshBorn</span>
                </div>
            </div>
        </footer>
    </div>

    <div id="filePopup" class="popup-overlay">
        <div class="popup">
            <div class="popup-header">
                <h3>Select Log File</h3>
                <button class="close-popup">&times;</button>
            </div>
            <div class="popup-content">
                <div class="file-list" id="fileList"></div>
                <button onclick="refreshLogs()" class="refresh-btn" id="refreshBtn">
                    Refresh Files
                </button>
            </div>
        </div>
    </div>

    <script src="icons.js"></script>
    <script src="script.js"></script>
</body>
</html>
